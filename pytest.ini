[pytest]
testpaths = tests
norecursedirs =
    node_modules
    joyce-env
    backups
    static
    setup/src
    setup/target
    certbot
    .git
    __pycache__
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Tests that need a real Elasticsearch are excluded from the default run. Start a
# cluster (see tests/es/conftest.py) and run them with:
#   npm run test:py:es
markers =
    integration: requires a running Elasticsearch
addopts = -m "not integration"
