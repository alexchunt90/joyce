# Serve /static/ from disk instead of proxying it to the Flask app.
#
# Included by each HTTPS server block in nginx.conf. It lives in one file so the cache
# policy cannot drift between local, staging and production.
#
# Until this existed nginx had no /static/ location at all, so the JS bundle and the ~1GB
# of images under static/img fell through `location /` to waitress, which runs a small
# fixed thread pool. Werkzeug served them with `Cache-Control: no-cache`, meaning a
# conditional request per asset per page view — each one occupying a Python worker thread
# for the length of the transfer, with `proxy_buffering off` holding it open at the
# client's pace.
#
# ./static is mounted read-only at /usr/share/nginx/static, so `root` maps
# /static/<path> to /usr/share/nginx/static/<path>. `root` rather than `alias` because a
# location without a trailing slash plus `alias` is the classic path-traversal footgun;
# with `root` the prefix is always part of the resolved path.

# Everything webpack emits is content-hashed — joyce.<hash>.js, <hash>.woff2 — so the URL
# changes whenever the bytes change and these can never be served stale.
location /static/js/ {
  root /usr/share/nginx;
  try_files $uri =404;
  # One add_header, not `expires` as well: they each emit their own Cache-Control and
  # the response ends up carrying two.
  add_header Cache-Control "public, max-age=31536000, immutable";
}

# Uploaded media is NOT content-addressed: re-uploading to an existing media document
# overwrites static/img/<id>/img.<ext> in place — see index_and_save_media_file in
# blueprints/es_func.py. So this must not be immutable. A day is the compromise: readers
# stop re-requesting every image on every page view, and an editor who replaces an image
# sees the new one after a hard refresh rather than immediately.
location /static/ {
  root /usr/share/nginx;
  try_files $uri =404;
  add_header Cache-Control "public, max-age=86400";
}
