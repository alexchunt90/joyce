services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - cluster.routing.allocation.disk.watermark.enable_for_single_data_node=true
      - xpack.security.enabled=true
      - KEYSTORE_PASSWORD=${KEYSTORE_PASSWORD}
      - path.repo=/mnt/snapshots
      # Without this Elasticsearch sizes its own heap at 50% of *host* RAM — 1.91GiB on
      # the 3.8GiB production VM — and -XX:+AlwaysPreTouch commits every page of it at
      # startup. Setting Xmx explicitly also halves MaxDirectMemorySize to 512MiB, which
      # takes the process ceiling from ~3.3GiB to ~1.8GiB. The corpus is ~5,300 documents
      # over ~14MB of source text; it has never needed a 2GiB heap.
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    # A ceiling Docker enforces, so exceeding it kills this container rather than letting
    # the kernel pick the largest process on the host. `restart: unless-stopped` brings it
    # back, and it shows up as OOMKilled=true in `docker inspect` — which is what the
    # June crashes did not, because they were host OOM kills with nothing left behind.
    mem_limit: 2g
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
      - elasticsearch-config:/usr/share/elasticsearch/config
      - ./backups/elasticsearch:/mnt/snapshots:ro
    # ports:
    #   - "9200:9200"
    restart: unless-stopped

  kibana:
    image: kibana:8.17.0
    # Not part of the default stack. Kibana is ~1GB resident on a 3.8GiB host, it was
    # running throughout the window when Elasticsearch was being OOM-killed every 8-20
    # hours, and the crashes stopped within a day of it stopping. Nothing in the
    # application talks to it — it is an operator tool, so start it when an operator
    # wants it:
    #
    #   docker compose --profile debug up -d kibana
    #   docker compose --profile debug down            # or: docker compose stop kibana
    #
    # `docker compose up -d` on its own no longer starts it, and no longer stops it
    # either: a profiled service is invisible to commands that do not name the profile.
    profiles: ["debug"]
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - KIBANA_USER_PASS=${KIBANA_USER_PASSWORD}
    volumes:
      - ./kibana.yml:/usr/share/kibana/config/kibana.yml

    ports:
      # Loopback only. Kibana has no TLS and nothing in front of it, and it holds
      # credentials for the cluster; published on 0.0.0.0 it was reachable from the
      # internet. Reach it through an SSH tunnel instead:
      #
      #   ssh -L 5601:localhost:5601 <host>   then open http://localhost:5601
      - "127.0.0.1:5601:5601"
    depends_on:
      - elasticsearch

  web:
    container_name: flask_backend
    build: .
    expose: 
      - "8080"
    ports:
      - "8080:8080"
    volumes:
      - ./static:/usr/joyce/static
      - ./setup:/usr/joyce/setup
      - ./blueprints:/usr/joyce/blueprints
      - ./templates:/usr/joyce/templates
      - ./.env:/usr/joyce/.env
      - ./config.py:/usr/joyce/config.py
      - ./application.py:/usr/joyce/application.py
      - ./backups:/usr/joyce/backups
    restart: unless-stopped
    environment:
      - HOST_ENVIRONMENT=docker
    depends_on:
      - elasticsearch

  nginx:
    image: nginx:latest
    container_name: nginx_proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./nginx-static.conf:/etc/nginx/snippets/static.conf:ro
      # Same host directory the web service writes uploads to, mounted read-only so
      # nginx can serve /static/ without the request reaching Flask.
      - ./static:/usr/share/nginx/static:ro
      - ./server.key:/etc/nginx/server.key
      - ./server.crt:/etc/nginx/server.crt
      - ./certbot/www/:/var/www/certbot/:ro
      - ./certbot/conf/:/etc/letsencrypt/:rw
    restart: unless-stopped
    depends_on:
      - web

  certbot:
    image: certbot/certbot:latest
    volumes:
      - ./certbot/www/:/var/www/certbot/:rw
      - ./certbot/conf/:/etc/letsencrypt/:rw


volumes:
  elasticsearch-data:
    driver: local
  elasticsearch-config:
    driver: local

# STAGING VM NOTES
# /etc/sysctl.conf: vm.max_map_count = 262144
