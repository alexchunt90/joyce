name: Tests

# `push` is unfiltered so every commit on every branch is checked. The previous
# `branches: [master]` filter, paired with `pull_request`, left a gap: a push to a
# feature branch with no *open* PR matched neither trigger and ran nothing at all.
# That is exactly what happened after PR #16 merged — two pushes landed with no checks.
#
# `pull_request` is narrowed to opened/reopened to avoid running twice for the same
# commit. A PR's status checks match on head SHA regardless of which event produced
# the run, so the `push` run above already reports on the PR; this only covers a PR
# opened against commits pushed earlier.
on:
  push:
  pull_request:
    types: [opened, reopened]

# A rapid series of pushes supersedes itself; only the newest commit on a ref needs
# checking.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Jest (Node 18)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
      - run: npm ci
      - run: npm test

  backend:
    name: Pytest (Python 3.11.7 — matches Dockerfile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Pinned to the Dockerfile's interpreter. This job is the contract:
          # local dev may run a newer Python, but production parity is enforced here.
          python-version: '3.11.7'
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      # No env block here on purpose. tests/conftest.py assigns everything config.py
      # needs, before any project import. Setting them here too split the suite's
      # fixture data across two files that then disagreed — this job set a different
      # ADMIN_EMAIL_ADDRESSES, the conftest deferred to it with setdefault, and nine
      # google_auth tests failed in CI while passing locally.
      - run: python -m pytest

  integration:
    name: Pytest integration (real Elasticsearch)
    runs-on: ubuntu-latest
    services:
      # Same image and version as the compose service, on a different port so nothing
      # here can reach a real cluster. Security is off because the test client is
      # unauthenticated; production keeps xpack.security enabled.
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
        env:
          discovery.type: single-node
          xpack.security.enabled: false
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 9201:9200
        options: >-
          --health-cmd "curl -fsS http://localhost:9200 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.7'
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      # These are excluded from the default run by pytest.ini's addopts, so they are
      # selected explicitly here.
      - run: python -m pytest -m integration
        env:
          TEST_ELASTICSEARCH_HOST: http://localhost:9201
